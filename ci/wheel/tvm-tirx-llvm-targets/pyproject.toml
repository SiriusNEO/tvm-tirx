[project]
name = "apache-tvm-tirx-llvm-targets"
version = "0.1.0a2"
description = "Additional LLVM code generation targets for TVM TIRx"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["apache-tvm-tirx==0.1.0a2"]

[build-system]
requires = [
  "scikit-build-core>=0.11",
  "mlc-llvm-static[all]==23.1.1",
  "mlc-z3-static==5.3.1.post0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.py-api = "py3"
build-dir = "build"
build.targets = ["tvm_tirx_llvm_backend"]
install.components = ["tvm_tirx_llvm_backend"]
wheel.packages = ["python/tvm_tirx_llvm_targets"]
wheel.install-dir = "tvm_tirx_llvm_targets"

[tool.scikit-build.cmake.define]
TVM_TIRX_BUILD_PYTHON_MODULE = "OFF"
TVM_TIRX_LLVM_NATIVE_ONLY = "OFF"
